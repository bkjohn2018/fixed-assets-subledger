name: supplier_history
grain: ap_invoice_distribution_accounting_event
primary_key: [INVOICE_DISTRIBUTION_ID, AE_HEADER_ID]
foreign_keys:
  - SUPPLIER_ID -> D_Supplier.SUPPLIER_ID
  - CODE_COMBINATION_ID -> D_COA.CODE_COMBINATION_ID
refresh:
  cadence: daily
  partitioning: by_month(GL_DATE)
columns:
  - {name: SUPPLIER_ID, type: NUMBER, required: true}
  - {name: INVOICE_NUMBER, type: VARCHAR2(50), required: true}
  - {name: INVOICE_DATE, type: DATE, required: true}
  - {name: GL_DATE, type: DATE, required: true}
  - {name: CODE_COMBINATION_ID, type: NUMBER, required: true}
  - {name: DISTRIBUTION_AMOUNT, type: NUMBER, required: true}
  - {name: INVOICE_DISTRIBUTION_ID, type: NUMBER, required: true}
  - {name: AE_HEADER_ID, type: NUMBER, required: true}
source_notes:
  oracle_release: 26B
  source_path: SLA linkage from AP invoice distributions
  rationale: Use SLA tables to scope to accounted AP activity while preserving AP distribution amount at distribution grain.
  join_logic:
    - AP_INVOICE_DISTRIBUTIONS_ALL.INVOICE_DISTRIBUTION_ID = XLA_DISTRIBUTION_LINKS.SOURCE_DISTRIBUTION_ID_NUM_1
    - XLA_DISTRIBUTION_LINKS.SOURCE_DISTRIBUTION_TYPE = AP_INV_DIST
    - XLA_DISTRIBUTION_LINKS.APPLICATION_ID = 200
    - XLA_DISTRIBUTION_LINKS.AE_HEADER_ID = XLA_AE_HEADERS.AE_HEADER_ID
    - AP_INVOICE_DISTRIBUTIONS_ALL.INVOICE_ID = AP_INVOICES_ALL.INVOICE_ID
  suggested_sql: |
    SELECT
        ai.vendor_id AS supplier_id,
        ai.invoice_num AS invoice_number,
        ai.invoice_date AS invoice_date,
        xah.accounting_date AS gl_date,
        aid.dist_code_combination_id AS code_combination_id,
        aid.amount AS distribution_amount,
        aid.invoice_distribution_id,
        xah.ae_header_id
    FROM ap_invoice_distributions_all aid
    JOIN ap_invoices_all ai
      ON ai.invoice_id = aid.invoice_id
    JOIN xla_distribution_links xdl
      ON xdl.source_distribution_id_num_1 = aid.invoice_distribution_id
     AND xdl.source_distribution_type = 'AP_INV_DIST'
     AND xdl.application_id = 200
    JOIN xla_ae_headers xah
      ON xah.ae_header_id = xdl.ae_header_id
     AND xah.application_id = xdl.application_id
    WHERE xah.accounting_entry_status_code = 'F'
      AND (:p_supplier_id IS NULL OR ai.vendor_id = :p_supplier_id)
      AND (:p_gl_date_from IS NULL OR xah.accounting_date >= :p_gl_date_from)
      AND (:p_gl_date_to IS NULL OR xah.accounting_date < :p_gl_date_to + 1);
validation_notes:
  - If duplicates appear for the same INVOICE_DISTRIBUTION_ID and AE_HEADER_ID, include XLA_AE_LINES and filter to the liability or charge accounting class per reporting policy.
  - For summarized spend history, aggregate DISTRIBUTION_AMOUNT by SUPPLIER_ID and period after extraction.
version: 26B
